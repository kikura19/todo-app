<div class="todo-container">
    <h2>Todoリスト</h2>
    <ag-grid-angular style="width: 100%; height: 400px;" class="ag-theme-alpine" [rowData]="todos"
        [columnDefs]="columnDefs" (cellValueChanged)="onCellValueChanged($event)" [gridOptions]="gridOptions"
        [overlayNoRowsTemplate]="noRowsTemplate" [rowSelection]="'multiple'" [rowMultiSelectWithClick]="true"
        (gridReady)="onGridReady($event)" [overlayLoadingTemplate]="loadingTemplate"> </ag-grid-angular>

    <div style="margin-bottom: 10px;">
        <button mat-raised-button color="primary" (click)="addNewTask()">
            + 新規追加
        </button>

        <button mat-raised-button color="primary" (click)="addNewTestTask()">
            簡易新規追加
        </button>

        <button mat-raised-button color="warn" (click)="onDeleteSelected()">
            選択したタスクを削除
        </button>

        <button mat-raised-button (click)="completed()">
            完了済みにする
        </button>

        <button mat-raised-button (click)="onDeleteCompleted()">
            完了済みタスクを削除
        </button>
    </div>

</div>
